      parameters:
        - name: ano
          in: query
          schema: { type: integer }
        - name: frota
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MensalComparativo"

  /despesas:
    get:
      operationId: listDespesas
      tags: [despesas]
      summary: List expense records
      parameters:
        - name: frota
          in: query
          schema: { type: string }
        - name: cidade
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
