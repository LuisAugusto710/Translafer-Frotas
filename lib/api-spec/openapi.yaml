  /dashboard/por-periodo:
    get:
      operationId: getRevenueByPeriodo
      tags: [dashboard]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [diario, semanal, mensal, trimestral, anual]
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: frota
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodoRevenue"

  /dashboard/diesel-por-placa:
    get:
      operationId: getDieselByPlaca
      tags: [dashboard]
      parameters:
        - name: ano
          in: query
          schema: { type: integer }
        - name: frota
          in: query
