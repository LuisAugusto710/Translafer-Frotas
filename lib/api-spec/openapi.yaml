openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Fleet Revenue Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: fretes
  - name: abastecimentos
  - name: despesas
  - name: dashboard
  - name: fleet-configs
  - name: employees
  - name: maintenance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /fretes:
    get:
      operationId: listFretes
      tags: [fretes]
      summary: List freight records
      parameters:
        - name: frota
          in: query
          schema: { type: string }
        - name: cliente
          in: query
          schema: { type: string }
        - name: origem
          in: query
          schema: { type: string }
        - name: placa
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreteListResponse"
    post:
      operationId: createFrete
      tags: [fretes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"
        "409":
          description: CTE/NF number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fretes/bulk:
    post:
      operationId: bulkCreateFretes
      tags: [fretes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkFreteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFreteResult"

  /fretes/next-cte:
    get:
      operationId: getNextCte
      tags: [fretes]
      summary: Get the next available sequential CTE number for a carrier
      parameters:
        - name: transp
          in: query
          schema: { type: string }
          description: Carrier name to scope the CTE sequence (omit for global max)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextCteResponse"

  /fretes/{id}:
    get:
      operationId: getFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreteUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /frotas:
    get:
      operationId: listFrotas
      tags: [fretes]
      summary: List unique fleet trucks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrotaSummary"

  /abastecimentos:
    get:
      operationId: listAbastecimentos
      tags: [abastecimentos]
      summary: List fuel records
      parameters:
        - name: placa
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbastecimentoListResponse"
    post:
      operationId: createAbastecimento
      tags: [abastecimentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbastecimentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abastecimento"

  /abastecimentos/{id}:
    put:
      operationId: updateAbastecimento
      tags: [abastecimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbastecimentoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abastecimento"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAbastecimento
      tags: [abastecimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /placas:
    get:
      operationId: listPlacas
      tags: [abastecimentos]
      summary: List unique truck plates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlacaSummary"

  /dashboard/resumo:
    get:
      operationId: getDashboardResumo
      tags: [dashboard]
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: frota
          in: query
