      operationId: deleteManutencao
      tags: [maintenance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /manutencoes/{id}/anexo:
    get:
      operationId: getManutencaoAnexo
      tags: [maintenance]
      summary: Download attachment for a maintenance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachment file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteManutencaoAnexo
      tags: [maintenance]
      summary: Remove attachment from a maintenance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated record without attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manutencao"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /manutencao-intervalos:
    get:
      tags: [maintenance]
      summary: List maintenance intervals
      operationId: listManutencaoIntervalos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManutencaoIntervalo"
    post:
      tags: [maintenance]
      summary: Create or upsert maintenance interval
      operationId: createManutencaoIntervalo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManutencaoIntervaloInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManutencaoIntervalo"

  /manutencao-intervalos/{id}:
    put:
      tags: [maintenance]
      summary: Update maintenance interval
      operationId: updateManutencaoIntervalo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManutencaoIntervaloInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManutencaoIntervalo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [maintenance]
      summary: Delete maintenance interval
      operationId: deleteManutencaoIntervalo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /manutencao-intervalos/preventiva:
    get:
      tags: [maintenance]
      summary: Preventive maintenance status per fleet and category
      operationId: getManutencaoPreventiva
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManutencaoPreventivaItem"

