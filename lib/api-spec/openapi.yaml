                  $ref: "#/components/schemas/MotoristaAjudanteItem"

  /dashboard/diesel-avg-price:
    get:
      operationId: getDieselAvgPrice
      tags: [dashboard]
      summary: Average diesel price per litre across all fuel records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
