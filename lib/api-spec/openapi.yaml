openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Fleet Revenue Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: fretes
  - name: abastecimentos
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /fretes:
    get:
      operationId: listFretes
      tags: [fretes]
      summary: List freight records
      parameters:
        - name: frota
          in: query
          schema: { type: string }
        - name: cliente
          in: query
          schema: { type: string }
        - name: origem
          in: query
          schema: { type: string }
        - name: placa
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreteListResponse"
    post:
      operationId: createFrete
      tags: [fretes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"

  /fretes/bulk:
    post:
      operationId: bulkCreateFretes
      tags: [fretes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkFreteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFreteResult"

  /fretes/{id}:
    get:
      operationId: getFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreteUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frete"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFrete
      tags: [fretes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /frotas:
    get:
      operationId: listFrotas
      tags: [fretes]
      summary: List unique fleet trucks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrotaSummary"

  /abastecimentos:
    get:
      operationId: listAbastecimentos
      tags: [abastecimentos]
      summary: List fuel records
      parameters:
        - name: placa
          in: query
          schema: { type: string }
        - name: mes
          in: query
          schema: { type: string }
        - name: ano
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbastecimentoListResponse"
    post:
      operationId: createAbastecimento
      tags: [abastecimentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbastecimentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abastecimento"

  /abastecimentos/{id}:
    put:
      operationId: updateAbastecimento
      tags: [abastecimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbastecimentoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abastecimento"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAbastecimento
      tags: [abastecimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /placas:
    get:
      operationId: listPlacas
      tags: [abastecimentos]
      summary: List unique truck plates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlacaSummary"

  /dashboard/resumo:
    get:
      operationId: getDashboardResumo
      tags: [dashboard]
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResumo"

  /dashboard/por-frota:
    get:
      operationId: getRevenueByFrota
      tags: [dashboard]
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrotaRevenue"

  /dashboard/por-periodo:
    get:
      operationId: getRevenueByPeriodo
      tags: [dashboard]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [diario, semanal, mensal, trimestral, anual]
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodoRevenue"

  /dashboard/diesel-por-placa:
    get:
      operationId: getDieselByPlaca
      tags: [dashboard]
      parameters:
        - name: ano
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DieselByPlaca"

  /dashboard/mensal:
    get:
      operationId: getMensalComparativo
      tags: [dashboard]
      parameters:
        - name: ano
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MensalComparativo"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Frete:
      type: object
      properties:
        id:
          type: integer
        dataCte:
          type: string
          format: date
        origem:
          type: string
        transporte:
          type: ["string", "null"]
        frota:
          type: string
        transp:
          type: ["string", "null"]
        cliente:
          type: string
        cidade:
          type: string
        cteNf:
          type: ["string", "null"]
        peso:
          type: number
        frete:
          type: number
        pedagio:
          type: number
        totalFrete:
          type: number
        dtaFrete:
          type: ["string", "null"]
          format: date
        vencimento:
          type: ["string", "null"]
          format: date
        obs:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - dataCte
        - origem
        - frota
        - cliente
        - cidade
        - peso
        - frete
        - pedagio
        - totalFrete
        - createdAt
        - updatedAt

    FreteInput:
      type: object
      properties:
        dataCte:
          type: string
          format: date
        origem:
          type: string
        transporte:
          type: string
        frota:
          type: string
        transp:
          type: string
        cliente:
          type: string
        cidade:
          type: string
        cteNf:
          type: string
        peso:
          type: number
        frete:
          type: number
        pedagio:
          type: number
        dtaFrete:
          type: string
          format: date
        vencimento:
          type: string
          format: date
        obs:
          type: string
      required:
        - dataCte
        - origem
        - frota
        - cliente
        - cidade
        - frete

    FreteUpdate:
      type: object
      properties:
        dataCte:
          type: string
          format: date
        origem:
          type: string
        transporte:
          type: string
        frota:
          type: string
        transp:
          type: string
        cliente:
          type: string
        cidade:
          type: string
        cteNf:
          type: string
        peso:
          type: number
        frete:
          type: number
        pedagio:
          type: number
        dtaFrete:
          type: string
          format: date
        vencimento:
          type: string
          format: date
        obs:
          type: string

    FreteListResponse:
      type: object
      properties:
        fretes:
          type: array
          items:
            $ref: "#/components/schemas/Frete"
        total:
          type: integer
      required: [fretes, total]

    BulkFreteInput:
      type: object
      properties:
        fretes:
          type: array
          items:
            $ref: "#/components/schemas/FreteInput"
      required: [fretes]

    BulkFreteResult:
      type: object
      properties:
        created:
          type: integer
        fretes:
          type: array
          items:
            $ref: "#/components/schemas/Frete"
      required: [created, fretes]

    FrotaSummary:
      type: object
      properties:
        frota:
          type: string
        totalFretes:
          type: integer
        totalFrete:
          type: number
        totalPedagio:
          type: number
        totalGeral:
          type: number
      required: [frota, totalFretes, totalFrete, totalPedagio, totalGeral]

    Abastecimento:
      type: object
      properties:
        id:
          type: integer
        mes:
          type: string
        ano:
          type: integer
        requisicao:
          type: ["string", "null"]
        posto:
          type: ["string", "null"]
        data:
          type: string
          format: date
        placa:
          type: string
        litros:
          type: number
        precoLitro:
          type: number
        totalPago:
          type: number
        kmInicio:
          type: ["number", "null"]
        kmFinal:
          type: ["number", "null"]
        kmPercorrido:
          type: ["number", "null"]
        media:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - mes
        - ano
        - data
        - placa
        - litros
        - precoLitro
        - totalPago
        - createdAt
        - updatedAt

    AbastecimentoInput:
      type: object
      properties:
        mes:
          type: string
        ano:
          type: integer
        requisicao:
          type: string
        posto:
          type: string
        data:
          type: string
          format: date
        placa:
          type: string
        litros:
          type: number
        precoLitro:
          type: number
        totalPago:
          type: number
        kmInicio:
          type: number
        kmFinal:
          type: number
        kmPercorrido:
          type: number
        media:
          type: number
      required:
        - mes
        - ano
        - data
        - placa
        - litros
        - precoLitro
        - totalPago

    AbastecimentoUpdate:
      type: object
      properties:
        mes:
          type: string
        ano:
          type: integer
        requisicao:
          type: string
        posto:
          type: string
        data:
          type: string
          format: date
        placa:
          type: string
        litros:
          type: number
        precoLitro:
          type: number
        totalPago:
          type: number
        kmInicio:
          type: number
        kmFinal:
          type: number
        kmPercorrido:
          type: number
        media:
          type: number

    AbastecimentoListResponse:
      type: object
      properties:
        abastecimentos:
          type: array
          items:
            $ref: "#/components/schemas/Abastecimento"
        total:
          type: integer
      required: [abastecimentos, total]

    PlacaSummary:
      type: object
      properties:
        placa:
          type: string
        totalAbastecimentos:
          type: integer
        totalLitros:
          type: number
        totalPago:
          type: number
        mediaGeral:
          type: ["number", "null"]
      required: [placa, totalAbastecimentos, totalLitros, totalPago]

    DashboardResumo:
      type: object
      properties:
        totalFrete:
          type: number
        totalPedagio:
          type: number
        totalGeral:
          type: number
        totalViagens:
          type: integer
        totalPeso:
          type: number
        mediaPorViagem:
          type: number
        melhorFrota:
          type: ["string", "null"]
        totalDiesel:
          type: number
        totalLitros:
          type: number
      required:
        - totalFrete
        - totalPedagio
        - totalGeral
        - totalViagens
        - totalPeso
        - mediaPorViagem
        - totalDiesel
        - totalLitros

    FrotaRevenue:
      type: object
      properties:
        frota:
          type: string
        totalFrete:
          type: number
        totalPedagio:
          type: number
        totalGeral:
          type: number
        totalViagens:
          type: integer
        rank:
          type: integer
      required: [frota, totalFrete, totalPedagio, totalGeral, totalViagens, rank]

    PeriodoRevenue:
      type: object
      properties:
        periodo:
          type: string
        totalFrete:
          type: number
        totalPedagio:
          type: number
        totalGeral:
          type: number
        totalViagens:
          type: integer
      required: [periodo, totalFrete, totalPedagio, totalGeral, totalViagens]

    DieselByPlaca:
      type: object
      properties:
        placa:
          type: string
        totalLitros:
          type: number
        totalPago:
          type: number
        mediaGeral:
          type: ["number", "null"]
        kmTotal:
          type: ["number", "null"]
        totalAbastecimentos:
          type: integer
      required: [placa, totalLitros, totalPago, totalAbastecimentos]

    MensalComparativo:
      type: object
      properties:
        mes:
          type: string
        frete:
          type: number
        pedagio:
          type: number
        diesel:
          type: number
        lucroLiquido:
          type: number
        viagens:
          type: integer
      required: [mes, frete, pedagio, diesel, lucroLiquido, viagens]
